<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>

      <text x="320" y="24" text-anchor="middle" class="title">The menstrual cycle (about 28 days)</text>
      <rect x="40" y="210" width="560" height="10" fill="#e9a3a0" stroke="#8f2f2c" stroke-width="1"/>
      <polygon points="40,210 40,180 50,182.2 60,184.4 70,186.6 80,188.8 90,191 100,193.2 110,195.4 120,197.6 130,199.8 140,202 150,200.7 160,199.4 170,198.1 180,196.8 190,195.5 200,194.2 210,192.9 220,191.6 230,190.3 240,189 250,187.7 260,186.4 270,185.1 280,183.8 290,182.5 300,181.2 310,179.9 320,178.6 330,178.75 340,178.5 350,178.25 360,178 370,177.75 380,177.5 390,177.25 400,177 410,176.75 420,176.5 430,176.25 440,176 450,175.75 460,175.5 470,175.25 480,175 490,174.75 500,174.5 510,174.25 520,174 530,173.75 540,173.5 550,173.25 560,173 570,172.75 580,172.5 590,172.25 600,172 600,210" fill="#d46a66" opacity=".85" stroke="#8f2f2c" stroke-width="1.5"/>
      <rect x="40" y="176" width="100" height="34" fill="#c0392b" opacity=".15"/>
      <path d="M64 212 q-4 8 0 11 q4 -3 0 -11Z" fill="#d46a66" opacity="0.9"/><path d="M88 212 q-4 8 0 11 q4 -3 0 -11Z" fill="#d46a66" opacity="0.7"/><path d="M112 212 q-4 8 0 11 q4 -3 0 -11Z" fill="#d46a66" opacity="0.5"/>
      <circle cx="320" cy="148" r="9" fill="#fff3d6" stroke="#b5651d" stroke-width="2"/><circle cx="319" cy="147" r="3.5" fill="#9b59b6"/>
      <path d="M320 160 v12" stroke="#17181a" stroke-width="1.5" stroke-dasharray="3 2"/>
      <line x1="60" y1="210" x2="60" y2="217" stroke="#17181a" stroke-width="1.5"/><text x="60" y="232" text-anchor="middle" class="cap">day 1</text><line x1="180" y1="210" x2="180" y2="217" stroke="#17181a" stroke-width="1.5"/><text x="180" y="232" text-anchor="middle" class="cap">day 7</text><line x1="320" y1="210" x2="320" y2="217" stroke="#17181a" stroke-width="1.5"/><text x="320" y="232" text-anchor="middle" class="cap">day 14</text><line x1="460" y1="210" x2="460" y2="217" stroke="#17181a" stroke-width="1.5"/><text x="460" y="232" text-anchor="middle" class="cap">day 21</text><line x1="600" y1="210" x2="600" y2="217" stroke="#17181a" stroke-width="1.5"/><text x="600" y="232" text-anchor="middle" class="cap">day 28</text>
      <text x="320" y="254" text-anchor="middle" class="cap">the band shows how thick the uterus lining is</text>
      
  <g class="lbl" data-part="menstruation">
    <line class="leader" x1="38" y1="70" x2="90" y2="192"/>
    <circle class="dot" cx="90" cy="192" r="3.5"/>
    <text class="name" x="44" y="74.5" text-anchor="start">Menstruation (period)</text>
    <g class="letter"><circle cx="53" cy="70" r="9.5"/><text x="53" y="74.5" text-anchor="middle"></text></g>
  </g>
      
  <g class="lbl" data-part="builds">
    <line class="leader" x1="154" y1="120" x2="220" y2="190"/>
    <circle class="dot" cx="220" cy="190" r="3.5"/>
    <text class="name" x="160" y="124.5" text-anchor="start">Lining builds up</text>
    <g class="letter"><circle cx="169" cy="120" r="9.5"/><text x="169" y="124.5" text-anchor="middle"></text></g>
  </g>
      
  <g class="lbl" data-part="ovulation">
    <line class="leader" x1="344" y1="70" x2="326" y2="142"/>
    <circle class="dot" cx="326" cy="142" r="3.5"/>
    <text class="name" x="350" y="74.5" text-anchor="start">Ovulation</text>
    <g class="letter"><circle cx="359" cy="70" r="9.5"/><text x="359" y="74.5" text-anchor="middle"></text></g>
  </g>
      
  <g class="lbl" data-part="thick">
    <line class="leader" x1="434" y1="120" x2="480" y2="174"/>
    <circle class="dot" cx="480" cy="174" r="3.5"/>
    <text class="name" x="440" y="124.5" text-anchor="start">Lining stays thick</text>
    <g class="letter"><circle cx="449" cy="120" r="9.5"/><text x="449" y="124.5" text-anchor="middle"></text></g>
  </g>
</svg>

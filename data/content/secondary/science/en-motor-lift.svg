      <line x1="260" y1="63" x2="296" y2="63" stroke="#17181a" stroke-width="4"/>
      <rect x="296" y="48" width="14" height="30" rx="3" fill="#b8c2cc" stroke="#6f7b86" stroke-width="2"/><line x1="310" y1="72" x2="310" y2="216" stroke="#17181a" stroke-width="2"/>
      <path d="M310 216 v8" stroke="#17181a" stroke-width="3"/>
      <rect x="286" y="224" width="48" height="16" rx="3" fill="#8a8f96" stroke="#5c5f63" stroke-width="2"/>
      <rect x="286" y="240" width="48" height="16" rx="3" fill="#8a8f96" stroke="#5c5f63" stroke-width="2"/>

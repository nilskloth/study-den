      <text x="246" y="250" text-anchor="end" class="cap">rises</text><text x="280" y="326" text-anchor="middle" class="cap">chemical store (battery) → electrically → motor → mechanically (the string pulls)</text>
      <text x="280" y="344" text-anchor="middle" class="cap">→ gravitational potential store of the weight</text>
  <g class="lbl" data-part="battery">
    <line class="leader" x1="64" y1="18" x2="95" y2="66"/>
    <circle class="dot" cx="95" cy="66" r="3.5"/>
    <text class="name" x="70" y="22.5" text-anchor="start">Battery</text>
    <g class="letter"><circle cx="79" cy="18" r="9.5"/><text x="79" y="22.5" text-anchor="middle"></text></g>
  </g>
  <g class="lbl" data-part="motor">

    <text x="160" y="336" text-anchor="middle" class="title">Breathing in</text>
    <text x="160" y="356" text-anchor="middle" class="cap">Intercostal muscles contract: ribs up and out</text>
    <text x="160" y="372" text-anchor="middle" class="cap">Diaphragm contracts and flattens</text>
    <text x="160" y="388" text-anchor="middle" class="cap">Volume up, pressure down → air in</text>
    <text x="470" y="336" text-anchor="middle" class="title">Breathing out</text>
    <text x="470" y="356" text-anchor="middle" class="cap">Intercostal muscles relax: ribs down and in</text>
    <text x="470" y="372" text-anchor="middle" class="cap">Diaphragm relaxes and domes up</text>
    <text x="470" y="388" text-anchor="middle" class="cap">Volume down, pressure up → air out</text>

    <circle class="dot" cx="412" cy="230" r="3.5"/>
    <text class="name" x="500" y="254.5" text-anchor="start">Thin wall, one cell thick</text>
    <g class="letter"><circle cx="509" cy="250" r="9.5"/><text x="509" y="254.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="vessel">

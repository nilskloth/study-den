    <circle class="dot" cx="290" cy="200" r="3.5"/>
    <text class="name" x="500" y="184.5" text-anchor="start">Blood capillaries</text>
    <g class="letter"><circle cx="509" cy="180" r="9.5"/><text x="509" y="184.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="wall">

    <text x="250" y="30" text-anchor="middle" class="cap">small food molecules (like glucose) in the gut</text>
    <line x1="40" y1="320" x2="460" y2="320" stroke="#d64541" stroke-width="5"/>
    
  <g class="lbl" data-part="villus">
    <line class="leader" x1="494" y1="60" x2="110" y2="96"/>
    <circle class="dot" cx="110" cy="96" r="3.5"/>
    <text class="name" x="500" y="64.5" text-anchor="start">Villus</text>
    <g class="letter"><circle cx="509" cy="60" r="9.5"/><text x="509" y="64.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="capillary">

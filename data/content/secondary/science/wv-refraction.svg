    <g class="letter"><circle cx="465" cy="344" r="9.5"/><text x="465" y="348.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="block">
    <line class="leader" x1="156" y1="270" x2="200" y2="260"/>
    <circle class="dot" cx="200" cy="260" r="3.5"/>
    <text class="name" x="150" y="274.5" text-anchor="end">Glass block</text>

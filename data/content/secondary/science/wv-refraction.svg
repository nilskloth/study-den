    <g class="letter"><circle cx="465" cy="196" r="9.5"/><text x="465" y="200.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="emergent">
    <line class="leader" x1="450" y1="344" x2="422.7165626227439" y2="355.1786636222151"/>

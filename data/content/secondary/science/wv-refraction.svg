<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>

    <rect x="170" y="130" width="250" height="160" fill="#d6ecf7" stroke="#5d8aa8" stroke-width="2.5"/>
    <line x1="250" y1="40" x2="250" y2="210" stroke="#6a6d71" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="345.03965609047947" y1="210" x2="345.03965609047947" y2="380" stroke="#6a6d71" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="150.4" y1="46.4" x2="250.0" y2="130.0" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/><path d="M195.3 89.2 L204.0 91.4 L200.3 83.2" fill="none" stroke="#a85a10" stroke-width="2.2" stroke-linejoin="round"/><line x1="250.0" y1="130.0" x2="345.0" y2="290.0" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/><path d="M292.6 209.3 L300.1 214.3 L299.3 205.3" fill="none" stroke="#a85a10" stroke-width="2.2" stroke-linejoin="round"/><line x1="345.0" y1="290.0" x2="444.6" y2="373.6" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/><path d="M389.9 332.8 L398.7 335.0 L395.0 326.8" fill="none" stroke="#a85a10" stroke-width="2.2" stroke-linejoin="round"/>
    
  <g class="lbl" data-part="incident">
    <line class="leader" x1="156" y1="104" x2="180.289955676173" y2="71.50632751852493"/>
    <circle class="dot" cx="180.289955676173" cy="71.50632751852493" r="3.5"/>
    <text class="name" x="150" y="108.5" text-anchor="end">Incident ray</text>
    <g class="letter"><circle cx="141" cy="104" r="9.5"/><text x="141" y="108.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="normal">
    <line class="leader" x1="272" y1="44" x2="250" y2="60"/>
    <circle class="dot" cx="250" cy="60" r="3.5"/>
    <text class="name" x="278" y="48.5" text-anchor="start">Normal</text>
    <g class="letter"><circle cx="287" cy="44" r="9.5"/><text x="287" y="48.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="refracted">
    <line class="leader" x1="450" y1="196" x2="278.51189682714386" y2="178"/>
    <circle class="dot" cx="278.51189682714386" cy="178" r="3.5"/>

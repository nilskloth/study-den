    <!-- plant -->
    <rect x="410" y="46" width="220" height="210" rx="10" fill="#4e9a4e" stroke="#2f6b2f" stroke-width="2"/>
    <rect x="422" y="58" width="196" height="186" rx="8" fill="#fff3d6" stroke="#b5651d" stroke-width="3"/>
    <path d="M460 100 C480 70 580 70 594 110 C606 160 580 220 530 226 C470 230 440 180 460 100Z" fill="#d6ecf7" stroke="#7fb3d5" stroke-width="2"/>

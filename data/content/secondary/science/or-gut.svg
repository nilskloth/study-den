<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>

    <!-- outline of the body -->
    <path d="M250 20 C250 -20 350 -20 350 20 C350 60 330 76 326 92 C420 100 450 130 450 200 V470 C450 500 400 520 300 524 C200 520 150 500 150 470 V200 C150 130 180 100 274 92 C270 76 250 60 250 20Z" fill="#fbf6ef" stroke="#d9cfc2" stroke-width="2"/>
    <!-- mouth -->
    <path d="M282 44 C292 38 308 38 318 44 C308 54 292 54 282 44Z" fill="#f3b8a6" stroke="#b5654f" stroke-width="2"/>
    <!-- large intestine: up the right side of the body (viewer's left), across, down, then rectum -->
    <path d="M196 432 V268 C196 250 204 246 220 246 H390 C404 246 410 254 410 268 V430 C410 450 360 456 320 462 C300 466 300 474 300 482" fill="none" stroke="#9a6236" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M196 432 V268 C196 250 204 246 220 246 H390 C404 246 410 254 410 268 V430 C410 450 360 456 320 462 C300 466 300 474 300 482" fill="none" stroke="#e2a77c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 482 V500" fill="none" stroke="#b5654f" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M300 482 V500" fill="none" stroke="#f3b8a6" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- small intestine -->
    <path d="M340 268 C310 270 240 268 230 290 C220 310 370 296 370 314 C370 330 230 318 230 332 C220 342 370 328 370 346 C370 362 230 350 230 364 C220 374 370 360 370 378 C370 394 230 382 230 396 C220 406 370 392 370 410 C370 426 230 414 230 428 C230 440 210 440 196 432" fill="none" stroke="#b5654f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M340 268 C310 270 240 268 230 290 C220 310 370 296 370 314 C370 330 230 318 230 332 C220 342 370 328 370 346 C370 362 230 350 230 364 C220 374 370 360 370 378 C370 394 230 382 230 396 C220 406 370 392 370 410 C370 426 230 414 230 428 C230 440 210 440 196 432" fill="none" stroke="#f3b8a6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- oesophagus and stomach -->
    <path d="M300 50 V150 C300 160 310 168 320 170" fill="none" stroke="#b5654f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M300 50 V150 C300 160 310 168 320 170" fill="none" stroke="#f3b8a6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M314 160 C340 140 400 140 412 170 C424 204 396 240 360 240 C340 240 334 232 340 224 C360 216 360 200 340 190 C328 184 316 176 314 160Z" fill="#f3b8a6" stroke="#b5654f" stroke-width="2.5"/>
    <path d="M342 228 C330 236 336 260 340 268" fill="none" stroke="#b5654f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M342 228 C330 236 336 260 340 268" fill="none" stroke="#f3b8a6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- liver (over the stomach, on the body's right = viewer's left) -->
    <path d="M170 170 C180 136 260 128 330 150 C310 170 280 200 240 214 C200 226 166 210 170 170Z" fill="#a85a44" stroke="#6e3526" stroke-width="2.5"/>
    <!-- pancreas, tucked under the stomach -->
    <path d="M352 238 C370 246 410 238 428 224 C434 236 416 252 390 256 C370 258 356 252 352 238Z" fill="#f2d47e" stroke="#b08d1e" stroke-width="2"/>
    
  <g class="lbl" data-part="mouth">
    <line class="leader" x1="116" y1="44" x2="282" y2="44"/>
    <circle class="dot" cx="282" cy="44" r="3.5"/>
    <text class="name" x="110" y="48.5" text-anchor="end">Mouth</text>
    <g class="letter"><circle cx="101" cy="44" r="9.5"/><text x="101" y="48.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="oesophagus">
    <line class="leader" x1="484" y1="80" x2="306" y2="110"/>
    <circle class="dot" cx="306" cy="110" r="3.5"/>
    <text class="name" x="490" y="84.5" text-anchor="start">Oesophagus</text>
    <g class="letter"><circle cx="499" cy="80" r="9.5"/><text x="499" y="84.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="liver">
    <line class="leader" x1="116" y1="150" x2="210" y2="180"/>
    <circle class="dot" cx="210" cy="180" r="3.5"/>
    <text class="name" x="110" y="154.5" text-anchor="end">Liver</text>
    <g class="letter"><circle cx="101" cy="150" r="9.5"/><text x="101" y="154.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="stomach">
    <line class="leader" x1="484" y1="150" x2="396" y2="180"/>
    <circle class="dot" cx="396" cy="180" r="3.5"/>
    <text class="name" x="490" y="154.5" text-anchor="start">Stomach</text>
    <g class="letter"><circle cx="499" cy="150" r="9.5"/><text x="499" y="154.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="pancreas">
    <line class="leader" x1="484" y1="220" x2="418" y2="232"/>
    <circle class="dot" cx="418" cy="232" r="3.5"/>
    <text class="name" x="490" y="224.5" text-anchor="start">Pancreas</text>
    <g class="letter"><circle cx="499" cy="220" r="9.5"/><text x="499" y="224.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="small">
    <line class="leader" x1="484" y1="320" x2="360" y2="340"/>
    <circle class="dot" cx="360" cy="340" r="3.5"/>
    <text class="name" x="490" y="324.5" text-anchor="start">Small intestine</text>
    <g class="letter"><circle cx="499" cy="320" r="9.5"/><text x="499" y="324.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="large">
    <line class="leader" x1="116" y1="300" x2="196" y2="330"/>
    <circle class="dot" cx="196" cy="330" r="3.5"/>
    <text class="name" x="110" y="304.5" text-anchor="end">Large intestine</text>
    <g class="letter"><circle cx="101" cy="300" r="9.5"/><text x="101" y="304.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="rectum">
    <line class="leader" x1="116" y1="440" x2="310" y2="470"/>
    <circle class="dot" cx="310" cy="470" r="3.5"/>
    <text class="name" x="110" y="444.5" text-anchor="end">Rectum</text>
    <g class="letter"><circle cx="101" cy="440" r="9.5"/><text x="101" y="444.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="anus">
    <line class="leader" x1="484" y1="500" x2="304" y2="502"/>
    <circle class="dot" cx="304" cy="502" r="3.5"/>
    <text class="name" x="490" y="504.5" text-anchor="start">Anus</text>
    <g class="letter"><circle cx="499" cy="500" r="9.5"/><text x="499" y="504.5" text-anchor="middle"></text></g>
  </g>
</svg>

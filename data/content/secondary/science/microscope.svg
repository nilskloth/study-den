    <g class="letter"><circle cx="111" cy="170" r="9.5"/><text x="111" y="174.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="clips">
    <line class="leader" x1="126" y1="246" x2="204" y2="232"/>
    <circle class="dot" cx="204" cy="232" r="3.5"/>
    <text class="name" x="120" y="250.5" text-anchor="end">Stage clips</text>
    <g class="letter"><circle cx="111" cy="246" r="9.5"/><text x="111" y="250.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="stage">
    <line class="leader" x1="384" y1="242" x2="316" y2="242"/>
    <circle class="dot" cx="316" cy="242" r="3.5"/>
    <text class="name" x="390" y="246.5" text-anchor="start">Stage</text>
    <g class="letter"><circle cx="399" cy="242" r="9.5"/><text x="399" y="246.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="light">
    <line class="leader" x1="126" y1="290" x2="240" y2="270"/>
    <circle class="dot" cx="240" cy="270" r="3.5"/>
    <text class="name" x="120" y="294.5" text-anchor="end">Light</text>
    <g class="letter"><circle cx="111" cy="290" r="9.5"/><text x="111" y="294.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="coarse">
    <line class="leader" x1="384" y1="278" x2="356" y2="288"/>
    <circle class="dot" cx="356" cy="288" r="3.5"/>
    <text class="name" x="390" y="282.5" text-anchor="start">Coarse focusing wheel</text>
    <g class="letter"><circle cx="399" cy="278" r="9.5"/><text x="399" y="282.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="fine">
    <line class="leader" x1="384" y1="314" x2="348" y2="300"/>
    <circle class="dot" cx="348" cy="300" r="3.5"/>
    <text class="name" x="390" y="318.5" text-anchor="start">Fine focusing wheel</text>
    <g class="letter"><circle cx="399" cy="314" r="9.5"/><text x="399" y="318.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="arm">
    <line class="leader" x1="384" y1="150" x2="312" y2="150"/>
    <circle class="dot" cx="312" cy="150" r="3.5"/>
    <text class="name" x="390" y="154.5" text-anchor="start">Arm</text>
    <g class="letter"><circle cx="399" cy="150" r="9.5"/><text x="399" y="154.5" text-anchor="middle"></text></g>
  </g>
    
  <g class="lbl" data-part="base">
    <line class="leader" x1="126" y1="400" x2="190" y2="412"/>
    <circle class="dot" cx="190" cy="412" r="3.5"/>
    <text class="name" x="120" y="404.5" text-anchor="end">Base</text>
    <g class="letter"><circle cx="111" cy="400" r="9.5"/><text x="111" y="404.5" text-anchor="middle"></text></g>
  </g>
</svg>

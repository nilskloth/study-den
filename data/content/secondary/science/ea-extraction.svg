<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>
<text x="20" y="24" class="title">Most reactive</text><text x="20" y="438" class="title">Least reactive</text><line x1="150" y1="34" x2="150" y2="418" stroke="#17181a" stroke-width="2.5" stroke-linecap="round"/><path d="M146.1 409.9 L150 418 L153.9 409.9" fill="none" stroke="#17181a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="42" width="160" height="26" rx="6" fill="#e6dcf2" stroke="#9a9da1" stroke-width="1"/>
          <text x="204" y="60" class="title">Potassium</text><text x="338" y="60" text-anchor="end" class="cap">K</text><rect x="190" y="73" width="160" height="26" rx="6" fill="#e6dcf2" stroke="#9a9da1" stroke-width="1"/>

          <text x="204" y="401" class="title">Gold</text><text x="338" y="401" text-anchor="end" class="cap">Au</text><path d="M366 42 q10 0 10 10 V126 q0 8 8 8 q-8 0 -8 8 V216 q0 10 -10 10" fill="none" stroke="#17181a" stroke-width="2"/><text x="396" y="111" class="title">Electrolysis</text><text x="396" y="129" class="cap">more reactive than carbon,</text><text x="396" y="147" class="cap">so carbon cannot take</text><text x="396" y="165" class="cap">the oxygen away</text><path d="M366 259 q10 0 10 10 V296.5 q0 8 8 8 q-8 0 -8 8 V340 q0 10 -10 10" fill="none" stroke="#17181a" stroke-width="2"/><text x="396" y="290.5" class="title">Heat with carbon</text><text x="396" y="308.5" class="cap">less reactive than carbon,</text><text x="396" y="326.5" class="cap">so carbon displaces them</text><path d="M366 352 q10 0 10 10 V374 q0 8 8 8 q-8 0 -8 8 V402 q0 10 -10 10" fill="none" stroke="#17181a" stroke-width="2"/><text x="396" y="368" class="title">Found as the metal</text><text x="396" y="386" class="cap">so unreactive they are</text><text x="396" y="404" class="cap">often found pure</text>

          <text x="204" y="215" class="title">Aluminium</text><text x="338" y="215" text-anchor="end" class="cap">Al</text><line x1="170" y1="241" x2="600" y2="241" stroke="#17181a" stroke-width="2" stroke-dasharray="7 5"/>
          <rect x="190" y="229" width="160" height="24" rx="12" fill="#17181a"/>

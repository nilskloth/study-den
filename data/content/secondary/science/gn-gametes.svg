  </g>
      
  <g class="lbl" data-part="jelly">
    <line class="leader" x1="594" y1="46" x2="530" y2="60"/>
    <circle class="dot" cx="530" cy="60" r="3.5"/>
    <text class="name" x="600" y="50.5" text-anchor="start">Jelly coat</text>
    <g class="letter"><circle cx="609" cy="46" r="9.5"/><text x="609" y="50.5" text-anchor="middle"></text></g>
  </g>

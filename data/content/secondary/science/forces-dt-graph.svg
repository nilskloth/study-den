    <g class="letter"><circle cx="184" cy="268" r="9.5"/><text x="184" y="272.5" text-anchor="middle"></text></g>
  </g>
  <g class="lbl" data-part="fast-steady">
    <line class="leader" x1="200" y1="218" x2="185" y2="193"/>
    <circle class="dot" cx="185" cy="193" r="3.5"/>
    <text class="name" x="206" y="222.5" text-anchor="start">fast steady speed</text>
    <g class="letter"><circle cx="215" cy="218" r="9.5"/><text x="215" y="222.5" text-anchor="middle"></text></g>
  </g>
  <g class="lbl" data-part="slowing-down">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>

    <line x1="70" y1="280" x2="520" y2="280" stroke="#3b3e42" stroke-width="2"/>
    <line x1="70" y1="280" x2="70" y2="30" stroke="#3b3e42" stroke-width="2"/>
    <path d="M512 275 L520 280 L512 285" fill="none" stroke="#3b3e42" stroke-width="2"/>
    <path d="M65 38 L70 30 L75 38" fill="none" stroke="#3b3e42" stroke-width="2"/>
    <text x="295" y="306" text-anchor="middle">time</text>
    <text x="56" y="155" text-anchor="middle" transform="rotate(-90 56 155)">distance</text><path d="M70 280 Q120 280 150 240 L220 147 Q250 107 300 107 L360 107 L470 67" fill="none" stroke="#2c6fbb" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="lbl" data-part="speeding-up">

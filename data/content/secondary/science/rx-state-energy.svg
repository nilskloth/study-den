<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 332" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>
<text x="300" y="26" text-anchor="middle" class="title">Changes of state: energy in and out</text>
      <path d="M40 300 V48 m-6 10 l6 -10 6 10" stroke="#17181a" stroke-width="1.8" fill="none"/>
      <text transform="translate(26 175) rotate(-90)" text-anchor="middle" class="cap">energy of the particles</text><rect x="230" y="50" width="140" height="40" rx="8" fill="#d6ecf7" stroke="#2e5c8a" stroke-width="1.4"/>
        <text x="300" y="75" text-anchor="middle" font-weight="700" style="">gas</text><rect x="230" y="145" width="140" height="40" rx="8" fill="#9cc9e6" stroke="#2e5c8a" stroke-width="1.4"/>
        <text x="300" y="170" text-anchor="middle" font-weight="700" style="">liquid</text><rect x="230" y="240" width="140" height="40" rx="8" fill="#5d8fb8" stroke="#2e5c8a" stroke-width="1.4"/>
        <text x="300" y="265" text-anchor="middle" font-weight="700" style="fill:#fff">solid</text><path d="M210 238 V187 m-6 10 l6 -10 6 10" stroke="#c0392b" stroke-width="2.4" fill="none"/>
      <text x="198" y="216.5" text-anchor="end" font-weight="700" style="fill:#c0392b">melting</text><path d="M210 143 V92 m-6 10 l6 -10 6 10" stroke="#c0392b" stroke-width="2.4" fill="none"/>
      <text x="198" y="121.5" text-anchor="end" font-weight="700" style="fill:#c0392b">boiling</text><path d="M390 92 V143 m-6 -10 l6 10 6 -10" stroke="#2479b8" stroke-width="2.4" fill="none"/>
      <text x="402" y="121.5" font-weight="700" style="fill:#2479b8">condensing</text><path d="M390 187 V238 m-6 -10 l6 10 6 -10" stroke="#2479b8" stroke-width="2.4" fill="none"/>
      <text x="402" y="216.5" font-weight="700" style="fill:#2479b8">freezing</text><text x="140" y="318" text-anchor="middle" class="cap" style="fill:#c0392b">going up: energy taken in</text>
      <text x="460" y="318" text-anchor="middle" class="cap" style="fill:#2479b8">going down: energy given out</text>
</svg>

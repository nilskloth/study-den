<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>

    <rect x="14" y="14" width="200" height="150" rx="12" fill="#fff" stroke="#c9c9c4"/>
    <text x="114" y="36" text-anchor="middle" class="title">Nerve cell</text>
    <path d="M24 80 h130" stroke="#d4a017" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="80" r="14" fill="#f5d76e" stroke="#b58a00" stroke-width="2"/><circle cx="42" cy="80" r="5" fill="#9b59b6"/>
    <path d="M34 70 l-12 -14 M38 67 l-4 -16 M30 86 l-14 10 M48 92 l4 16 M154 80 l16 -14 M154 80 l16 14 M154 80 l20 0" stroke="#b58a00" stroke-width="2.5" stroke-linecap="round"/>
    <text x="114" y="140" text-anchor="middle" class="cap">long + branched</text>
    <text x="114" y="156" text-anchor="middle" class="cap">→ carries electrical signals</text>
    <rect x="224" y="14" width="200" height="150" rx="12" fill="#fff" stroke="#c9c9c4"/>
    <text x="324" y="36" text-anchor="middle" class="title">Sperm cell</text>
    <ellipse cx="274" cy="80" rx="18" ry="12" fill="#cfe5f5" stroke="#4a7fa8" stroke-width="2"/><ellipse cx="274" cy="80" rx="10" ry="7" fill="#9b59b6"/>
    <rect x="290" y="75" width="14" height="10" rx="4" fill="#e67e22"/>
    <path d="M304 80 c15 -16 25 16 40 0 s25 16 50 0" fill="none" stroke="#4a7fa8" stroke-width="3" stroke-linecap="round"/>
    <text x="324" y="140" text-anchor="middle" class="cap">tail + mitochondria</text>
    <text x="324" y="156" text-anchor="middle" class="cap">→ swims to the egg</text>
    <rect x="434" y="14" width="200" height="150" rx="12" fill="#fff" stroke="#c9c9c4"/>
    <text x="534" y="36" text-anchor="middle" class="title">Leaf (palisade) cell</text>
    <rect x="512" y="44" width="44" height="84" rx="6" fill="#fff3d6" stroke="#4e9a4e" stroke-width="3"/>
    <ellipse cx="542" cy="56" rx="9" ry="6" fill="#2e8b57" stroke="#1e5e3a"/><ellipse cx="542" cy="70" rx="9" ry="6" fill="#2e8b57" stroke="#1e5e3a"/><ellipse cx="542" cy="84" rx="9" ry="6" fill="#2e8b57" stroke="#1e5e3a"/><ellipse cx="542" cy="98" rx="9" ry="6" fill="#2e8b57" stroke="#1e5e3a"/>
    <circle cx="532" cy="116" r="6" fill="#9b59b6"/>
    <text x="534" y="140" text-anchor="middle" class="cap">full of chloroplasts</text>
    <text x="534" y="156" text-anchor="middle" class="cap">→ photosynthesis</text>
    <rect x="120" y="176" width="200" height="150" rx="12" fill="#fff" stroke="#c9c9c4"/>
    <text x="220" y="198" text-anchor="middle" class="title">Root hair cell</text>
    <path d="M160 218 h50 v10 l90 4 v16 l-90 4 v14 h-50Z" fill="#fff3d6" stroke="#4e9a4e" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="180" cy="242" r="9" fill="#9b59b6"/><ellipse cx="202" cy="252" rx="12" ry="6" fill="#d6ecf7" stroke="#7fb3d5"/>
    <path d="M260 216 l0 -8 M280 272 l0 8" stroke="#7fb3d5" stroke-width="2"/>
    <text x="220" y="302" text-anchor="middle" class="cap">long extension</text>
    <text x="220" y="318" text-anchor="middle" class="cap">→ absorbs water and minerals</text>
    <rect x="330" y="176" width="200" height="150" rx="12" fill="#fff" stroke="#c9c9c4"/>
    <text x="430" y="198" text-anchor="middle" class="title">Red blood cell</text>
    <ellipse cx="390" cy="242" rx="34" ry="30" fill="#e74c3c" stroke="#a93226" stroke-width="2"/><ellipse cx="390" cy="242" rx="18" ry="14" fill="#c0392b" opacity=".6"/>
    <path d="M440 242 a34 9 0 0 1 68 0 a34 9 0 0 1 -68 0 M450 240 q24 6 48 0" fill="#e74c3c" stroke="#a93226" stroke-width="2"/>
    <text x="474" y="264" text-anchor="middle" class="cap">side view</text>
    <text x="430" y="302" text-anchor="middle" class="cap">no nucleus, haemoglobin</text>
    <text x="430" y="318" text-anchor="middle" class="cap">→ carries oxygen</text>
</svg>

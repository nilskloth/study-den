      <text x="470" y="110" text-anchor="middle" font-weight="700" style="fill:#fff">load</text><line x1="180" y1="22" x2="180" y2="82" stroke="#d35400" stroke-width="4"/>
      <polygon points="180,92 187,82 173,82" fill="#d35400"/><line x1="470" y1="76" x2="470" y2="30" stroke="#2c6fbb" stroke-width="7"/>
      <polygon points="470,14 459,30 481,30" fill="#2c6fbb"/><text x="488" y="36" font-weight="700" fill="#2c6fbb">large force out</text>
  <g class="lbl" data-part="effort">

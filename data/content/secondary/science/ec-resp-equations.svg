<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 296" class="sci-fig " role="img">
  <style>
    text { font-family: Andika, 'Comic Sans MS', system-ui, sans-serif; font-size: 13px; fill: #17181a; }
    .title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 12px; fill: #5c5f63; }
    .lbl .leader { stroke: #6a6d71; stroke-width: 1.2; fill: none; }
    .lbl .dot { fill: #6a6d71; }
    .lbl .name { font-weight: 700; }
    .lbl .letter { display: none; }
    .lbl .letter circle { fill: #17181a; }
    .lbl .letter text { fill: #fff; font-weight: 700; font-size: 12px; }
    .quiz .lbl .name { display: none; }
    .quiz .lbl .letter { display: block; }
    .lbl.ask .leader { stroke: #c0392b; stroke-width: 2.5; }
    .lbl.ask .dot { fill: #c0392b; r: 6; }
    .lbl.ask .letter circle { fill: #c0392b; }
  </style>
<rect x="10" y="8" width="460" height="82" rx="12" fill="#fff" stroke="#2e6fb7" stroke-width="2"/>
    <text x="26" y="32" class="title" style="fill:#2e6fb7" fill="#2e6fb7">Aerobic respiration (with oxygen)</text>
    <text x="26" y="58" style="font-size:15px">glucose + oxygen → carbon dioxide + water</text><text x="26" y="84" style="font-size:15px"><tspan class="cap" style="font-size:12px">lots of energy released · in the mitochondria</tspan></text><rect x="10" y="108" width="460" height="82" rx="12" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <text x="26" y="132" class="title" style="fill:#c0392b" fill="#c0392b">Anaerobic respiration in muscles (no oxygen)</text>
    <text x="26" y="158" style="font-size:15px">glucose → lactic acid</text><text x="26" y="184" style="font-size:15px"><tspan class="cap" style="font-size:12px">much less energy released</tspan></text><rect x="10" y="208" width="460" height="82" rx="12" fill="#fff" stroke="#b5651d" stroke-width="2"/>
    <text x="26" y="232" class="title" style="fill:#b5651d" fill="#b5651d">Anaerobic respiration in yeast (fermentation)</text>
    <text x="26" y="258" style="font-size:15px">glucose → ethanol + carbon dioxide</text><text x="26" y="284" style="font-size:15px"><tspan class="cap" style="font-size:12px">much less energy released · plants too, when roots lack oxygen</tspan></text>
</svg>

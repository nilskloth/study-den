="translate(590,40)"><path d="M0,-22L6,0L0,-5L-6,0Z" fill="#2c3e50"/><text x="0" y="16" text-anchor="middle" font-weight="700">N</text></g><text x="10" y="22" class="cap">Contours every 50 m (heights in metres)</text>
